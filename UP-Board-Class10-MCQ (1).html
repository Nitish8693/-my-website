:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#fafaf7;--fg:#1c1c1a;--mu:#6b6a63;--card:#fff;--bd:#e2e0d8;--ac:#1d6b4f;--ok:#1d7a3a;--okb:#e3f4e8;--bad:#b3261e;--badb:#fbe7e5}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161714;--fg:#ececE6;--mu:#a09f96;--card:#22231f;--bd:#3a3b35;--ac:#4cc08f;--ok:#6fd48f;--okb:#1e3326;--bad:#ff8a80;--badb:#3a1f1d}}
:root[data-theme="dark"]{--bg:#161714;--fg:#ececE6;--mu:#a09f96;--card:#22231f;--bd:#3a3b35;--ac:#4cc08f;--ok:#6fd48f;--okb:#1e3326;--bad:#ff8a80;--badb:#3a1f1d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Noto Sans Devanagari",sans-serif}
main{max-width:640px;margin:0 auto;padding:14px}
h1{font-size:20px;margin:4px 0 12px}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{flex:1;padding:10px 4px;border:1px solid var(--bd);background:var(--card);color:var(--fg);border-radius:10px;font:inherit;font-size:14px}
.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.row{display:flex;gap:8px;margin-bottom:10px}
select,input,textarea{font:inherit;width:100%;box-sizing:border-box;padding:9px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--fg)}
textarea{min-height:110px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.q{font-weight:600;margin:0 0 10px}
.opt{display:block;width:100%;text-align:left;margin:6px 0;padding:11px;border:1px solid var(--bd);background:var(--bg);color:var(--fg);border-radius:10px;font:inherit}
.opt.ok{background:var(--okb);border-color:var(--ok)}
.opt.bad{background:var(--badb);border-color:var(--bad)}
.btn{padding:11px 14px;border:0;border-radius:10px;background:var(--ac);color:#fff;font:inherit;width:100%;margin-top:6px}
.btn.alt{background:var(--card);color:var(--fg);border:1px solid var(--bd)}
.btn:disabled{opacity:.5}
.mu{color:var(--mu);font-size:13px}
.ex{margin-top:8px;padding:10px;border-radius:10px;background:var(--bg);font-size:14px;white-space:pre-wrap}
.hd{display:flex;align-items:center;gap:12px;margin:4px 0 12px}.hd img{width:54px;height:54px;border-radius:50%;object-fit:cover;border:2px solid var(--ac)}.hd h1{margin:0}

 h+=`<div class="card"><p class="q">✍️ बिना AI के जोड़ें</p><div class="mu">हर लाइन में: सवाल | A | B | C | D | सही (1-4) | व्याख्या</div><textarea id="m" placeholder="भारत की राजधानी? | मुंबई | दिल्ली | कोलकाता | चेन्नई | 2 | राजधानी दिल्ली है"></textarea><button class="btn alt" onclick="addManual()">➕ जोड़ें (AI के बिना)</button></div>`;
 if(note)h+=`<p class="mu">${esc(note)}</p>`;
 prev.slice(0,5).forEach(q=>{h+=`<div class="card"><p class="q">${esc(q.q)}</p>${q.o.map((o,j)=>`<div class="${j===q.a?"mu":""}">${j===q.a?"✅ ":""}${"ABCD"[j]}. ${esc(o)}</div>`).join("")}<div class="ex">${esc(q.e)}</div></div>`});
 if(prev.length)h+=`<p class="mu">पहले 5 दिख रहे हैं, कुल ${prev.length}।</p><button class="btn" onclick="saveAll()">सब सेव करें (${prev.length})</button>`;
 return h+admUI()+manage()+`<p class="mu">सेव करने पर सवाल सभी students को दिखेंगे। सिर्फ Admin (आप और जिन्हें आप ने Editor बनाया) और AI जोड़/हटा सकते हैं। नया Admin जोड़ने के लिए पेज के Share मेनू से उसे Editor बनाएँ, हटाने के लिए उसका access हटाएँ।</p>`}
let stop=false;
async function bulk(){const t=$("#tp").value.trim();if(!t||!S||busy)return;busy=true;stop=false;let got=[],fails=0,lim=false,le="";try{const j=JSON.parse(localStorage.getItem("upjob")||"null");if(j&&j.t===t&&j.s===subj)got=j.got||[]}catch(e){}const seen=new Set(all().concat(prev,got).map(q=>q.q.replace(/\s+/g,"")));
 while(got.length<500&&fails<4&&!stop){note=`AI सवाल बना रहा है… ${got.length}/500 (पेज खुला रखें)`;render();
  const avoid=got.slice(-25).map(q=>q.q.slice(0,40)).join(" | ");
  try{const r=await S.json(`UP Board Class 10 ${subj} के चैप्टर "${t}" से, सिर्फ इसी चैप्टर के पाठ्यक्रम से, 20 नए अलग-अलग MCQ बनाओ, UP Board स्तर के, सही उत्तर पक्का करो। ये सवाल पहले आ चुके हैं, इन्हें न दोहराओ: ${avoid}\n${FMT}`,{cache:false});
   const qs=parseQs(r,subj,"AI").filter(q=>{const k=q.q.replace(/\s+/g,"");if(seen.has(k))return false;seen.add(k);return true});
   got=got.concat(qs.slice(0,500-got.length).map(q=>({...q,c:t})));if(!qs.length)fails++;try{localStorage.setItem("upjob",JSON.stringify({s:subj,t,got}))}catch(e){}}
  catch(e){le=String((e&&(e.code||e.message))||e);if(e&&e.code==="rate_limited"){await new Promise(r=>setTimeout(r,20000));fails+=0.25}else{fails++;if(e&&e.code==="not_granted"){lim=true;break}}}}
 prev=prev.concat(got);if(got.length>=500)try{localStorage.removeItem("upjob")}catch(e){}busy=false;note=(got.length<500&&!stop?"⚠️ AI की लिमिट खत्म/रुक गई — सवाल सुरक्षित हैं, बाद में वही चैप्टर लिखकर जारी रखें। ":"")+`${got.length} सवाल बने।${le&&got.length<500?" (कारण: "+le+")":""} देखकर "सब सेव करें" दबाएँ।`;render()}
function docHTML(){return"<!DOCTYPE html><html lang=\"hi\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\"><title>UP Board Class 10 MCQ</title><style id=\"css\">"+$("#css").textContent+"</style></head><body><main>"+$("#hd").outerHTML+"<div class=\"tabs\" id=\"tabs\"></div><div id=\"v\"></div></main>"+$("#guard").outerHTML+"<script id=\"bank\" type=\"application/json\">"+JSON.stringify(bank).replace(/</g,"\\u003c")+"<\/script><script id=\"admins\" type=\"application/json\">"+JSON.stringify(admins).replace(/</g,"\\u003c")+"<\/script><script src=\"https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js\"><\/script><script id=\"app\">"+$("#app").textContent+"<\/script></body></html>"}
function scanQR(f){if(!f)return;const img=new Image();img.onload=()=>{const c=document.createElement("canvas"),m=Math.min(1,1600/Math.max(img.width,img.height));c.width=img.width*m;c.height=img.height*m;const x=c.getContext("2d");x.drawImage(img,0,0,c.width,c.height);const d=x.getImageData(0,0,c.width,c.height),r=window.jsQR&&jsQR(d.data,c.width,c.height);URL.revokeObjectURL(img.src);if(r)fromQR(r.data);else{note="QR नहीं मिला, साफ़ फ़ोटो लें।";render()}};img.src=URL.createObjectURL(f)}
function fromQR(txt){let qs=[];try{const j=JSON.parse(txt);qs=parseQs(Array.isArray(j)?j:[j],subj,"")}catch(e){}
 if(!qs.length)qs=parseManual(txt);
 if(qs.length){prev=prev.concat(qs);note=`QR से ${qs.length} सवाल मिले। और स्कैन करें या सेव करें।`;render();return}
 if(!S){note="QR का डेटा पढ़ नहीं पाए।";render();return}
 $("#t").value=txt;gen("paper")}
function render(){
 if(!uname&&!owner){$("#tabs").innerHTML="";$("#v").innerHTML=gate();return}
 $("#tabs").innerHTML=[["quiz","📝 टेस्ट"],["ai","🤖 AI"]].concat(owner?[["add","➕ जोड़ें"]]:[]).map(([k,l])=>`<button class="${tab===k?"on":""}" onclick="go('${k}')">${l}</button>`).join("");
 const kt=tab==="add"&&$("#tp")?$("#tp").value:"",keep=tab==="add"&&$("#t")?$("#t").value:"",kd=tab==="ai"&&$("#d")?$("#d").value:"";
 $("#v").innerHTML=(uname?greet():"")+(tab==="ai"?tutor():tab==="add"&&owner?add():quiz());
 if(kt&&$("#tp")){$("#tp").value=kt;$("#b500").hidden=false}if(keep&&$("#t"))$("#t").value=keep;if(kd&&$("#d"))$("#d").value=kd}
render();
